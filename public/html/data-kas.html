<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <a href="/html/dashboard.html" class="back-btn">Back to Dashboard</a>
        <div class="page-header">
            <h1>Student Data - Monthly Dues</h1>
            <div class="add-month-box">
                <input type="text" id="new-month-input" placeholder="e.g. juli">
                <button class="btn-add" onclick="addMonth()">+ Add Month</button>
            </div>
        </div>

        <table>
            <thead>
                <tr id="thead-row"></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <div id="save-bar" class="save-bar hidden">
        <span id="pending-count"></span>
        <div class="save-bar-actions">
            <button class="btn-cancel" onclick="cancelChanges()">Cancel</button>
            <button class="btn-save" onclick="saveChanges()">Save Changes</button>
        </div>
    </div>

    <script src="../js/data-kas.js"></script>
</body>
</html>
