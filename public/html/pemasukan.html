<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <a href="/html/dashboard.html" class="back-btn">← Back to Dashboard</a>
    <div class="page-header">
        <h1>Income</h1>
        <button class="btn-add" onclick="showAddForm()">+ Add</button>
    </div>

    <div id="add-form" class="pg-form-box hidden">
        <div class="pg-form-grid">
            <div class="pg-field">
                <label>ID</label>
                <input type="text" id="add-id" readonly>
            </div>
            <div class="pg-field">
                <label>Date</label>
                <input type="date" id="add-tanggal">
            </div>
            <div class="pg-field">
                <label>Amount (Rp)</label>
                <input type="number" id="add-nominal" placeholder="e.g. 50000" min="1">
            </div>
            <div class="pg-field">
                <label>Description <span class="optional">(opsional)</span></label>
                <input type="text" id="add-keterangan" placeholder="Keterangan tambahan">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn-save" onclick="addData()">Save</button>
            <button class="btn-cancel" onclick="hideAddForm()">Cancel</button>
        </div>
    </div>

    <table class="pg-table pm-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>
<script src="/js/pemasukan.js"></script>
</body>
</html>
